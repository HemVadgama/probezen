name: Probezen API Drift Check
author: Hem Vadgama
description: Catch when an API changes without going down and show the response behavior that drifted.

branding:
  icon: shield
  color: purple

inputs:
  command:
    description: Workflow to run. One of check, doctor, scan, or status.
    required: false
    default: check
  fail-on:
    description: Lowest impact level that fails check. One of low, medium, high, or critical.
    required: false
    default: high
  config:
    description: Probezen configuration path, relative to working-directory.
    required: false
    default: probezen.yml
  working-directory:
    description: Application directory to inspect, relative to the repository root.
    required: false
    default: .
  upload-results:
    description: Upload the versioned JSON result as a workflow artifact.
    required: false
    default: "false"
  artifact-name:
    description: Name used when upload-results is true.
    required: false
    default: probezen-results

outputs:
  outcome:
    description: healthy, changes-detected, setup-required, baseline-required, monitoring-error, or configuration-error.
    value: ${{ steps.probezen.outputs.outcome }}
  findings:
    description: Number of behavioral change findings.
    value: ${{ steps.probezen.outputs.findings }}
  highest-severity:
    description: Highest finding severity, or none.
    value: ${{ steps.probezen.outputs.highest-severity }}
  result-file:
    description: Absolute path to the versioned JSON result.
    value: ${{ steps.probezen.outputs.result-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Probezen
      shell: bash
      env:
        PIP_DISABLE_PIP_VERSION_CHECK: "1"
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Analyze dependency reliability
      id: probezen
      shell: bash
      env:
        PROBEZEN_ACTION_COMMAND: ${{ inputs.command }}
        PROBEZEN_ACTION_FAIL_ON: ${{ inputs.fail-on }}
        PROBEZEN_ACTION_CONFIG: ${{ inputs.config }}
        PROBEZEN_ACTION_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        PROBEZEN_ACTION_RESULT_FILE: ${{ runner.temp }}/probezen-result.json
      run: python -m probezen.github_action

    - name: Upload Probezen JSON result
      if: ${{ always() && inputs.upload-results == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/probezen-result.json
        if-no-files-found: error
        retention-days: 14
