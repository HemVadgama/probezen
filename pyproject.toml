[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "probezen"
version = "0.2.0"
description = "Find external dependencies and detect changes that could break your application."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Probezen contributors"}]
dependencies = [
  "httpx>=0.27,<1",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "ruff>=0.6", "types-PyYAML>=6"]

[project.scripts]
probezen = "probezen.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["probezen"]
